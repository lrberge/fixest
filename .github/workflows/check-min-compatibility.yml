on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: check-min-compatibility

jobs:
  check-min-compatibility:
    runs-on: ubuntu-latest

    name: Min compatibility (dreamerr 1.4.0, stringmagic 1.2.0)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes
          needs: check

      - name: Install minimum dependency versions
        shell: Rscript {0}
        run: |
          remotes::install_version("dreamerr",    version = "1.4.0", repos = "https://cloud.r-project.org", upgrade = "never")
          remotes::install_version("stringmagic", version = "1.2.0", repos = "https://cloud.r-project.org", upgrade = "never")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
